name: clima_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: ^3.12.1


dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.3
  http: ^1.6.0


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

  fonts:
  - family: Spartan
    fonts:
    - asset: assets/fonts/SpartanMB-Black.otf
      weight: 900

